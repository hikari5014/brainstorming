name: Deploy translator to GitHub Pages

on:
  push:
    branches:
      - claude/gemini-realtime-translator-app-80jwx7
      - main
    paths:
      - 'translator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: translator
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
