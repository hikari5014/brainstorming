name: Deploy translator to GitHub Pages

# 部署策略：把 translator/ 的內容以 git plumbing 推成 gh-pages 分支。
# GitHub 對 gh-pages 分支自動啟用 Pages，繞過「以 API 建立 Pages 站台」
# 的 GITHUB_TOKEN 權限限制（Resource not accessible by integration）。

on:
  push:
    branches:
      - claude/gemini-realtime-translator-app-80jwx7
      - main
    paths:
      - 'translator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push translator/ tree to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE=$(git rev-parse HEAD:translator)
          COMMIT=$(git commit-tree "$TREE" -m "Deploy translator@${GITHUB_SHA::7} to GitHub Pages")
          git push --force origin "$COMMIT:refs/heads/gh-pages"
